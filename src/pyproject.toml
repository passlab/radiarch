[project]
name = "radiarch"
version = "0.2.0"
description = "Radiarch research treatment-planning service"
authors = [{ name = "Radiarch Team" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.111.0",
    "uvicorn[standard]~=0.30.0",
    "pydantic~=2.7",
    "pydantic-settings~=2.4",
    "httpx~=0.27.0",
    "python-multipart~=0.0.9",
    "loguru~=0.7.2",
    "celery~=5.4.0",
    "redis~=5.0.4",
    "SQLAlchemy~=2.0",
    "alembic~=1.13.2",
    "psycopg[binary]~=3.2",
    "dicomweb-client~=0.59.0",
    "pydicom>=3.0,<4",
    "numpy>=2.0,<3",
    "scipy~=1.12",
    "pandas~=2.2",
    "SimpleITK~=2.2",
    "matplotlib~=3.8",
    "scikit-image>=0.21",       # polygon2mask in the contour rasterizer
]

[project.optional-dependencies]
# Validation harness (radiarch/validation): case files and the independent DVH.
# The independent gamma uses pymedphys, which needs Python < 3.13; the harness
# runs it in its own environment through `uv run --python 3.12 --with pymedphys`.
validation = [
    "dicompyler-core>=0.5.6",
    "pyyaml>=6",
]

# GPU path of the native pencil-beam engine (RADIARCH_PB_DEVICE=gpu or auto), CUDA 12 runtime.
gpu = [
    "cupy-cuda12x>=13",
]


dev = [
    "pytest~=8.1",
    "pytest-asyncio~=0.23",
    "httpx~=0.27.0",
    "dicom-validator>=0.9",     # IOD validation of the RT objects radiarch writes (R6)
    "jsonschema>=4",            # the derivation record against the dataset manifest schema (R12)
    "ruff~=0.3.0",
    "black~=24.4",
    "mypy~=1.9"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
radiarch = "radiarch.cli:main"

[tool.setuptools.packages.find]
include = ["radiarch*"]

[tool.setuptools.package-data]
radiarch = [
    "machines/*.json",
    "goals/*.json",
    "protocols/*.json",
    "cwl/*.cwl",
    "services/dose_engines/*.txt",
    "validation/cases/*.yaml",
    "validation/known_findings.yaml",
    "validation/references/*.json",
    "validation/references/spectra/*",
    "validation/references/mc/*.npz",
    "validation/references/mc/*.json",
    "validation/references/pyradplan/*.npz",
    "validation/references/pyradplan/*.json",
]
