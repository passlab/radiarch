# Graded failures the validation records explain: findings about an engine or a reference, not regressions.
# `python -m radiarch.validation.run --known-findings` (CI's nightly run) exits non-zero only on errors and on
# graded failures that no entry here covers. `checks` is a regular expression on the check's name.
- case: photon_vs_mc
  checks: "^\\[(shipped|full)\\] "
  reason: "CCC against Monte Carlo: the shipped kernels' spectrum and scatter cut-off (R7 and R8 records; ADR 0014, ADR 0015)"
- case: dvh_crosscheck_pancreatic
  checks: " max \\(Gy\\)$"
  reason: "DVH maxima in partially rasterized edge voxels against dicompyler-core's (R7 record)"
- case: geometry_volumes_lctsc
  checks: "Esophagus volume"
  reason: "one oesophagus volume against the reference rasterization (R7 record)"
- case: pb_vs_ccc
  checks: "^water 10 x 10, 10 mm beamlets: gamma "
  reason: "pb 1.2.0 against CCC with 10 mm beamlets: CCC's shipped scatter cut-off at depth, and pb's sharper leaf edge, where pb follows the Monte Carlo (mlc-leaf-model.md, 2026-11-11)"
- case: mco_front_tg119
  checks: "^deliverable: Core D5 \\(Gy\\)$"
  reason: "the first Pareto set's deliverable plan: the known loss from fluence to apertures, which the second set recovers (its plan passes); with the leaf ends' tail 0.01 Gy over the institutions' limit (R11 record's rerun of 2026-11-12)"
