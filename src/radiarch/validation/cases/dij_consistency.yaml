name: dij_consistency
kind: dij_consistency
description: Dij · w against the forward dose for every physics engine through the services on SimpleFantom (random weights); the nightly MCsquare gate repeated in the record at 1e6 primaries (a fifth in fast mode, tolerances widened), the deterministic CCC identity, and the pencil-beam engine's sampled, cut-off Dij against its full-kernel forward dose (R8).
