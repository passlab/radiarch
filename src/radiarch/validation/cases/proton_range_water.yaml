description: single pencil-beam spots in water at several nominal energies; distal 80 % range R80 of the laterally integrated depth dose against the NIST PSTAR CSDA range (projected range differs by a fraction of a millimetre at these energies). Runs through radiarch's own MCsquare driver (R14) with a water-only calibration.
