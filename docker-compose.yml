# Radiarch TPS — Full Stack (README, "Quick Start — Docker Compose")
# Usage: cp .env.example .env && docker compose up -d --build        (add --profile viewer for the viewer)

services:
  # ---- API Server ----
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RADIARCH_BUILD_COMMIT: ${RADIARCH_BUILD_COMMIT:-}
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - RADIARCH_ENVIRONMENT=production
      - RADIARCH_DATABASE_URL=postgresql+psycopg://radiarch:radiarch@postgres:5432/radiarch
      - RADIARCH_BROKER_URL=redis://redis:6379/0
      - RADIARCH_RESULT_BACKEND=redis://redis:6379/1
      - RADIARCH_ORTHANC_BASE_URL=http://orthanc:8042
      - RADIARCH_ORTHANC_USE_MOCK=false
      - RADIARCH_ORTHANC_USERNAME=radiarch
      - RADIARCH_ORTHANC_PASSWORD=radiarch
      - RADIARCH_DICOMWEB_URL=http://orthanc:8042/dicom-web
      - RADIARCH_DICOMWEB_USERNAME=radiarch
      - RADIARCH_DICOMWEB_PASSWORD=radiarch
      - RADIARCH_VIEWER_URL=http://localhost:3000
      - RADIARCH_VIEWER_ROUTE=plan-review
      - RADIARCH_DATA_ROOT=/data/radiarch/testData/SimpleFantomWithStruct
      - RADIARCH_ARTIFACT_DIR=/data/artifacts   # the shared volume below: the API reads what the worker writes
    volumes:
      - radiarch-data:/data/artifacts
      - ./tests/data:/data/radiarch/testData:ro
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      orthanc:
        condition: service_started
    restart: unless-stopped

  # ---- Celery Worker ----
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RADIARCH_BUILD_COMMIT: ${RADIARCH_BUILD_COMMIT:-}
    # MCsquare ships Linux x86-64 binaries only; force amd64 so they run
    # (under Rosetta/QEMU emulation) on Apple Silicon / arm64 hosts.
    platform: linux/amd64
    # Consume every per-service queue. Tasks route to dose/optimize/evaluate/
    # maintenance via task_routes; in production eager mode is OFF, so a worker
    # with no -Q (default 'celery' queue only) would silently ignore them.
    command: >
      celery -A radiarch.tasks.celery_app worker --loglevel=info
      --concurrency=2 -Q celery,dose,optimize,evaluate,maintenance
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - RADIARCH_ENVIRONMENT=production
      - RADIARCH_DATABASE_URL=postgresql+psycopg://radiarch:radiarch@postgres:5432/radiarch
      - RADIARCH_BROKER_URL=redis://redis:6379/0
      - RADIARCH_RESULT_BACKEND=redis://redis:6379/1
      - RADIARCH_ORTHANC_BASE_URL=http://orthanc:8042
      - RADIARCH_ORTHANC_USE_MOCK=false
      - RADIARCH_ORTHANC_USERNAME=radiarch
      - RADIARCH_ORTHANC_PASSWORD=radiarch
      - RADIARCH_DICOMWEB_URL=http://orthanc:8042/dicom-web
      - RADIARCH_DICOMWEB_USERNAME=radiarch
      - RADIARCH_DICOMWEB_PASSWORD=radiarch
      - RADIARCH_VIEWER_URL=http://localhost:3000
      - RADIARCH_VIEWER_ROUTE=plan-review
      - RADIARCH_DATA_ROOT=/data/radiarch/testData/SimpleFantomWithStruct
      - RADIARCH_ARTIFACT_DIR=/data/artifacts   # the shared volume below: the API reads what the worker writes
    volumes:
      - radiarch-data:/data/artifacts
      - ./tests/data:/data/radiarch/testData:ro
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---- Redis (Celery Broker) ----
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: radiarch
      POSTGRES_PASSWORD: radiarch
      POSTGRES_DB: radiarch
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U radiarch" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- Orthanc DICOM Server ----
  orthanc:
    image: orthancteam/orthanc:24.6.2
    ports:
      - "8042:8042" # Web UI + REST API
      - "4242:4242" # DICOM port
    environment:
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__REGISTERED_USERS: |
        {"radiarch": "radiarch"}
    volumes:
      - orthanc-data:/var/lib/orthanc/db
    restart: unless-stopped


  # ---- Viewer (profile "viewer") ----
  # OHIF with radiarch's extensions and plan review mode; Orthanc's DICOMweb and radiarch's API behind one origin, the
  # API key added by the proxy (docs/viewing.md). Published on localhost only: whoever reaches it uses radiarch.
  #   docker compose --profile viewer up -d   ->  http://localhost:3000/plan-review?StudyInstanceUIDs=<study>
  viewer:
    profiles: ["viewer"]
    build:
      context: ./viewer
      dockerfile: standalone/Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    environment:
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_AUTHORIZATION: "Basic cmFkaWFyY2g6cmFkaWFyY2g="   # radiarch:radiarch, the Orthanc user above
      RADIARCH_URL: http://api:8000
      RADIARCH_API_KEY: ${RADIARCH_API_KEY:-}
    depends_on:
      - api
      - orthanc
    restart: unless-stopped

volumes:
  radiarch-data:
  redis-data:
  pg-data:
  orthanc-data:
