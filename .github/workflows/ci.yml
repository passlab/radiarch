name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Allow every job (fast, full, MCsquare validation) to be run on demand
  # from the Actions tab.
  workflow_dispatch:
  # Nightly run (03:17 UTC): the full CI matrix — fast tests, full tests, and
  # the real-MCsquare V4 physics gate — so a regression in any of the three
  # is caught overnight even when no PR touched it.
  schedule:
    - cron: "17 3 * * *"

jobs:
  fast-tests:
    name: Fast Tests (API + Backend)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Runs on PRs, pushes, and the nightly schedule / manual dispatch.
    if: >-
      github.event_name == 'push' || github.event_name == 'pull_request'
      || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout (sparse — skip large binaries and test data)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/
            tests/conftest.py
            tests/test_api_e2e.py
            tests/test_client.py
            tests/test_api_backend.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ./src[dev]

      - name: Run fast tests
        run: python -m pytest tests/test_api_e2e.py tests/test_client.py tests/test_api_backend.py -v

  full-tests:
    # The full suite incl. Services 3-6 on the analytic engine. The real-MCsquare
    # V4 validation auto-skips here (RADIARCH_RUN_MCSQUARE_VALIDATION unset) —
    # Monte Carlo is slow / tolerance-sensitive, so it runs in mcsquare-validation
    # below instead of blocking every PR.
    name: Full Tests (Services 1-6, analytic engine)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # R13: an Orthanc with its DICOMweb plugin, the server a viewer (OHIF) reads; the push and
    # read-back test (tests/test_r13_viewer.py) uses it through RADIARCH_TEST_DICOMWEB_URL.
    services:
      orthanc:
        image: orthancteam/orthanc:24.6.2
        ports:
          - 8042:8042
        env:
          ORTHANC__AUTHENTICATION_ENABLED: "false"
          DICOM_WEB_PLUGIN_ENABLED: "true"
    # Runs on PRs, pushes, and the nightly schedule / manual dispatch.
    if: >-
      github.event_name == 'push' || github.event_name == 'pull_request'
      || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout (full — includes the engine assets and DICOM test data)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ./src[dev]

      - name: Install dicom3tools (dciodvfy for the RT objects radiarch writes)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dicom3tools

      - name: Wait for Orthanc's DICOMweb plugin
        run: |
          for i in $(seq 60); do curl -sf http://localhost:8042/dicom-web/studies >/dev/null && exit 0; sleep 2; done
          echo "Orthanc did not answer"; exit 1

      - name: Run full suite (MCsquare V4 validation auto-skips)
        run: python -m pytest tests/ -v --tb=short
        env:
          RADIARCH_TEST_DICOMWEB_URL: http://localhost:8042/dicom-web

      - name: dciodvfy on the written RT objects
        run: python -m pytest tests/test_r6_rt_writers.py -v --tb=short -k dciodvfy
        env:
          RADIARCH_REQUIRE_DCIODVFY: "1"

  viewer-build:
    # R13 (ADR 0018): the standalone viewer image (OHIF 3.13.13 built with radiarch's extensions and mode, nginx with the
    # proxy), then the browser test: a CT and a plan in Orthanc, radiarch's API with a key, the image in front of both,
    # headless Chromium through the plan review mode. The dose core's and the client's tests run in Full Tests.
    name: Viewer (image and browser test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'push' || github.event_name == 'pull_request'
      || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    services:
      orthanc:
        image: orthancteam/orthanc:24.6.2
        ports:
          - 8042:8042
        env:
          ORTHANC__AUTHENTICATION_ENABLED: "false"
          DICOM_WEB_PLUGIN_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Package tests without fixtures or a server (colormap, DVH parsing, goal rows)
        run: |
          node --test viewer/rt-dose-core/test/core.test.js
          node --test viewer/radiarch-client/test/client.test.js
          node --test viewer/radiarch-client/test/mco.test.js

      - name: Build the viewer image (OHIF with radiarch's packages, nginx)
        run: docker build -f viewer/standalone/Dockerfile -t radiarch-viewer:ci viewer/

      - name: The extensions and the mode are in the bundle
        run: |
          docker run --rm --entrypoint sh radiarch-viewer:ci -c '
            cd /usr/share/nginx/html &&
            grep -rlq "radiarch-isodose" . && grep -rlq "radiarch.goalTemplate" . &&
            grep -rlq "Plan review (radiarch, research)" . && echo "radiarch extensions and mode bundled"'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install radiarch and the browser
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e "./src[dev,viewer-test]"
          python -m playwright install --with-deps chromium

      - name: Wait for Orthanc's DICOMweb plugin
        run: |
          for i in $(seq 60); do curl -sf http://localhost:8042/dicom-web/studies >/dev/null && exit 0; sleep 2; done
          echo "Orthanc did not answer"; exit 1

      - name: Browser test of the standalone viewer
        env:
          RADIARCH_TEST_VIEWER_IMAGE: radiarch-viewer:ci
          RADIARCH_TEST_DICOMWEB_URL: http://127.0.0.1:8042/dicom-web
          RADIARCH_TEST_ARTIFACTS: ${{ runner.temp }}/viewer-artifacts
        run: python -m pytest tests/test_r13_viewer_browser.py tests/test_r11_viewer_browser.py -v --tb=short -rs

      - name: Screenshots and logs of the browser test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-browser-test
          path: ${{ runner.temp }}/viewer-artifacts
          if-no-files-found: ignore

  mcsquare-validation:
    # Opt-in V4 gate: real MCsquare Monte Carlo on the SimpleFantom (Dij vs dose
    # consistency). Runs nightly and on manual dispatch — not on PRs — because
    # Monte Carlo is slow and tolerance-sensitive. The Linux runner has the
    # MCsquare_linux binary, so this is where the real physics actually executes.
    name: MCsquare Validation (nightly / manual)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout (full — includes the engine assets and DICOM test data)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ./src[dev]

      - name: Run real-MCsquare V4 validation
        env:
          RADIARCH_RUN_MCSQUARE_VALIDATION: "1"
        run: python -m pytest tests/test_mcsquare_dij_consistency.py -v --tb=short

  validation-harness:
    # R7a: the validation harness in fast mode (coarser grids, fewer primaries) on the
    # cases that need no external data: photon physics on water and slab phantoms,
    # the proton range case, the synthetic gamma cross-check. Cases that need
    # a data directory outside the repo (RADIARCH_VALIDATION_DATA) skip here and run on the workstation. Results are
    # research targets against the commissioning literature, never a commissioning.
    name: Validation harness (nightly / manual, fast mode)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout (full — engine binaries and kernels)
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ./src[dev,validation]
      - name: Install uv (pymedphys runs in its own Python 3.12 environment)
        uses: astral-sh/setup-uv@v5
      - name: Run the harness (fast mode)
        # fails on errors and on graded failures the records do not explain (validation/known_findings.yaml)
        run: python -m radiarch.validation.run --all --fast --known-findings --out validation/results
      - name: Regression goldens
        run: python -m pytest tests/test_goldens.py -v --tb=short
      - name: Validation document per engine (R7)
        if: always()
        run: python -m radiarch.validation.report --out validation/reports
      - name: Upload results and documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            validation/results
            validation/reports
